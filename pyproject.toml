[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-lab2-custom"
version = "0.2.0"
description = "Controlled antenna-amplitude greeting study for Reachy Mini"
requires-python = ">=3.12,<3.13"
dependencies = ["reachy-mini==1.11.0", "numpy==2.5.3", "sounddevice==0.5.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
analysis = ["matplotlib==3.10.8"]

[tool.setuptools]
packages = ["reachy_lab2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
